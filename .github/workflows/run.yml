name: Run BTC Paper-Trading Bot

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write            # needed to commit the report back to the repo

concurrency:
  group: btc-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Trading Bot
        run: python bot.py
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            README.md
            index.html

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # keep the freshly generated report safe while we re-sync
          mkdir -p /tmp/report
          cp README.md index.html /tmp/report/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/report/README.md /tmp/report/index.html .
            git add README.md index.html
            if git diff --cached --quiet; then
              echo "No report changes to commit."
              exit 0
            fi
            git commit -m "Update report [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep 5
          done
          echo "Could not push after 5 attempts."
          exit 1
